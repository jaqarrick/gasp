# gasp --gpu rtx2080ti --run --config benchmarks/sweep/sweep.toml
#
# L2 pair: each thread sums 16 elements of a 2 MB array (N = 2^19 floats).
# "near" reads 16 neighbours, so most loads hit L1. "far" reads 16 elements
# N / 16 apart, 16 sweeps over the whole array: its loads miss L1 and, after the
# first sweep, hit L2 (2 MB of 5.5 MB on the RTX 2080 Ti). Same instructions and
# bytes, so any measured gap is where the data is served from. If "far" is
# slower than its L2 latency explains, L2 bandwidth binds (.local/l2_bandwidth.md).
#
# Check with ncu before trusting the pair: "near" L1 hit rate high, "far" L1
# hit rate near 0 and L2 hit rate near 15/16, DRAM traffic near 4 MB for both.
# The 16-read loop is unrolled, so there are no loop counts.

[defaults]
problem_size = 524288
block_size = 256
grid_size = 2048
params = { N = 524288 }
program_args = ["524288"]
# x and out, N floats each
footprint = 4194304

[[kernel]]
name = "near"
file = "benchmarks/sweep/sweep_near.cu"

[[kernel]]
name = "far"
file = "benchmarks/sweep/sweep_far.cu"
