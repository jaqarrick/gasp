# basic vs four mm variants, M = N = K = 1000, block 16x16; no bounds: mm_bounds writes C without a bounds check, so its edge threads corrupt C at N = 1000; reuse = L1 hit share by 32-byte sectors

[defaults]
problem_size = 1000
footprint = 12000000
block_size = [16, 16]
grid_size = [63, 63]
params = { M = 1000, N = 1000, K = 1000 }
program_args = ["1000", "1000", "1000", "16", "16"]

[[kernel]]
name = "basic"
file = "benchmarks/mm/mm_basic.cu"
loop_counts = [62, 0, 0]
reuse = 0.875

[[kernel]]
name = "uncoalesced"
file = "benchmarks/mm/mm_uncoalesced.cu"
loop_counts = [62, 0, 0]
reuse = 0.9706

[[kernel]]
name = "double"
file = "benchmarks/mm/mm_double.cu"
loop_counts = [62, 0, 0]
reuse = 0.875

[[kernel]]
name = "sfu"
file = "benchmarks/mm/mm_sfu.cu"
loop_counts = [250, 0]
reuse = 0.875

[[kernel]]
name = "tiled"
file = "benchmarks/mm/mm_tiled.cu"
loop_counts = [63]
reuse = 0
