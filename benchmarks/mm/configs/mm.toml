# basic vs five mm variants, M = N = K = 1024, block 16x16; reuse = L1 hit share by 32-byte sectors

[defaults]
problem_size = 1024
footprint = 12582912
block_size = [16, 16]
grid_size = [64, 64]
params = { M = 1024, N = 1024, K = 1024 }
program_args = ["1024", "1024", "1024", "16", "16"]

[[kernel]]
name = "basic"
file = "benchmarks/mm/mm_basic.cu"
loop_counts = [64, 0, 0]
reuse = 0.875

[[kernel]]
name = "uncoalesced"
file = "benchmarks/mm/mm_uncoalesced.cu"
loop_counts = [64, 0, 0]
reuse = 0.9706

[[kernel]]
name = "double"
file = "benchmarks/mm/mm_double.cu"
loop_counts = [64, 0, 0]
reuse = 0.875

[[kernel]]
name = "bounds"
file = "benchmarks/mm/mm_bounds.cu"
loop_counts = [256, 0]
reuse = 0.875

[[kernel]]
name = "sfu"
file = "benchmarks/mm/mm_sfu.cu"
loop_counts = [256, 0]
reuse = 0.875

[[kernel]]
name = "tiled"
file = "benchmarks/mm/mm_tiled.cu"
loop_counts = [64]
reuse = 0
