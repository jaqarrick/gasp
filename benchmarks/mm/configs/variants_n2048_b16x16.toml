# basic vs five mm variants, M = N = K = 2048, block 16x16; reuse = L1 hit share by 32-byte sectors

[defaults]
problem_size = 2048
footprint = 50331648
block_size = [16, 16]
grid_size = [128, 128]
params = { M = 2048, N = 2048, K = 2048 }
program_args = ["2048", "2048", "2048", "16", "16"]

[[kernel]]
name = "basic"
file = "benchmarks/mm/mm_basic.cu"
loop_counts = [128, 0, 0]
reuse = 0.875

[[kernel]]
name = "uncoalesced"
file = "benchmarks/mm/mm_uncoalesced.cu"
loop_counts = [128, 0, 0]
reuse = 0.9706

[[kernel]]
name = "double"
file = "benchmarks/mm/mm_double.cu"
loop_counts = [128, 0, 0]
reuse = 0.875

[[kernel]]
name = "bounds"
file = "benchmarks/mm/mm_bounds.cu"
loop_counts = [512, 0]
reuse = 0.875

[[kernel]]
name = "sfu"
file = "benchmarks/mm/mm_sfu.cu"
loop_counts = [512, 0]
reuse = 0.875

[[kernel]]
name = "tiled"
file = "benchmarks/mm/mm_tiled.cu"
loop_counts = [128]
reuse = 0
