# M = N = K = 2048; basic 8x8, tiled 16x16 (fixed tile)
# reuse: L1 hit share by sectors

[defaults]
problem_size = 2048
footprint = 50331648
block_size = [8, 8]
grid_size = [256, 256]
params = { M = 2048, N = 2048, K = 2048 }
program_args = ["2048", "2048", "2048", "8", "8"]

[[kernel]]
name = "basic"
file = "benchmarks/mm/mm_basic.cu"
loop_counts = [128, 0, 0]
reuse = 0.8

[[kernel]]
name = "tiled"
file = "benchmarks/mm/mm_tiled.cu"
block_size = [16, 16]
grid_size = [128, 128]
program_args = ["2048", "2048", "2048", "16", "16"]
loop_counts = [128]
reuse = 0
