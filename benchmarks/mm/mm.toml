[defaults]
problem_size = 1024
# distinct global bytes for the cache model: A, B and C, 1024 x 1024 floats each
footprint = 12582912
block_size = [16, 16]
grid_size = [64, 64]
params = { M = 1024, N = 1024, K = 1024 }
program_args = ["1024", "1024", "1024", "16", "16"]
# reuse: L1 hit share counted by 32-byte sectors per warp

[[kernel]]
name = "basic"
file = "benchmarks/mm/mm_basic.cu"
loop_counts = [64, 0, 0]  # 16-step main loop, 4-step and 1-step remainders
reuse = 0.875

[[kernel]]
name = "uncoalesced"
file = "benchmarks/mm/mm_uncoalesced.cu"
loop_counts = [64, 0, 0]  # 16-step main loop, 4-step and 1-step remainders
reuse = 0.9706  # all 8 warps share A's 16 rows (63/64); B 3/4; 16:1 sectors

[[kernel]]
name = "double"
file = "benchmarks/mm/mm_double.cu"
loop_counts = [64, 0, 0]  # 16-step main loop, 4-step and 1-step remainders
reuse = 0.875

[[kernel]]
name = "bounds"
file = "benchmarks/mm/mm_bounds.cu"
loop_counts = [256, 0]  # the if in the loop stops the 16x unroll: 4-step main loop, 1-step remainder
reuse = 0.875

[[kernel]]
name = "sfu"
file = "benchmarks/mm/mm_sfu.cu"
loop_counts = [256, 0]
reuse = 0.875

[[kernel]]
name = "tiled"
file = "benchmarks/mm/mm_tiled.cu"
loop_counts = [64]  # tiles of 16
reuse = 0
