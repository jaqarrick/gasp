# gasp --gpu rtx2080ti --run --config benchmarks/l2/l2.toml --override cache=profiled
#
# Same loop, 64 coalesced __ldcg loads per thread (256 MB in total). l2_resident
# reads a 2 MB array that fits L2; dram_stream reads a 256 MB array once. Tests
# GASPerf's L2 throughput limit. cache=profiled takes the hit rates from ncu, so
# the run checks the throughput term apart from the cache model.
#
# footprint: the array plus the 4 MB output.

[defaults]
problem_size = 1048576
block_size = 256
grid_size = 4096
params = { N = 1048576, reads = 64 }
program_args = ["1048576", "64"]

[[kernel]]
name = "dram_stream"
file = "benchmarks/l2/dram_stream.cu"
loop_counts = [16]
footprint = 272629760

[[kernel]]
name = "l2_resident"
file = "benchmarks/l2/l2_resident.cu"
loop_counts = [16]
footprint = 6291456
