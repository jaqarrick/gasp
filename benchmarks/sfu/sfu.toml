# Tests the GASPerf SFU pipe floor against GPUPerf's O_SFU.

[defaults]
problem_size = 1048576
block_size = 256
grid_size = 4096
params = { N = 1048576, n = 256 }
program_args = ["1048576", "256"]

[[kernel]]
name = "sfu_bound"
file = "benchmarks/sfu/sfu_bound.cu"
loop_counts = [256]

[[kernel]]
name = "sfu_free"
file = "benchmarks/sfu/sfu_free.cu"
loop_counts = [256]
