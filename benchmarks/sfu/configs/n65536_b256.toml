# SFU-bound vs SFU-free loop, N = 65536, block 256, n = 256 steps

[defaults]
problem_size = 65536
block_size = 256
grid_size = 256
params = { N = 65536, n = 256 }
program_args = ["65536", "256"]

[[kernel]]
name = "sfu_bound"
file = "benchmarks/sfu/sfu_bound.cu"
loop_counts = [256]

[[kernel]]
name = "sfu_free"
file = "benchmarks/sfu/sfu_free.cu"
loop_counts = [256]
