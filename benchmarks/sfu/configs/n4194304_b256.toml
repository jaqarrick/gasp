# SFU-bound vs SFU-free loop, N = 4194304, block 256, n = 256 steps

[defaults]
problem_size = 4194304
block_size = 256
grid_size = 16384
params = { N = 4194304, n = 256 }
program_args = ["4194304", "256"]

[[kernel]]
name = "sfu_bound"
file = "benchmarks/sfu/sfu_bound.cu"
loop_counts = [256]

[[kernel]]
name = "sfu_free"
file = "benchmarks/sfu/sfu_free.cu"
loop_counts = [256]
