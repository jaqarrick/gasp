# SFU-bound vs SFU-free loop, N = 262144, block 256, n = 256 steps

[defaults]
problem_size = 262144
block_size = 256
grid_size = 1024
params = { N = 262144, n = 256 }
program_args = ["262144", "256"]

[[kernel]]
name = "sfu_bound"
file = "benchmarks/sfu/sfu_bound.cu"
loop_counts = [256]

[[kernel]]
name = "sfu_free"
file = "benchmarks/sfu/sfu_free.cu"
loop_counts = [256]
