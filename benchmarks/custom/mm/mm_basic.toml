# gasp --gpu rtx2080ti --config benchmarks/custom/mm/mm_basic.toml
#
# n is the matrix side (n x n matrices), so problem_size = n, not n*n.
# The program launches a 16x16 block over a 64x64 grid. GASP and ncu see that
# as 256 threads per block and 4096 blocks, so grid_size is set explicitly
# (the default, ceil(problem_size / block_size), would be 4).

[defaults]
problem_size = 1024
block_size = 256
grid_size = 4096
loop_iterations = 8
program_args = ["1024"]

[[kernel]]
name = "mm_basic"
file = "benchmarks/custom/mm/mm_basic.cu"
