# gasp --gpu b200 --config benchmarks/custom/vecadd.toml
#
# A kernel entry wins over [defaults]. These kernels have no loops, so
# loop_iterations has no effect here; it shows how one kernel overrides a default.

[defaults]
problem_size = 1000000
block_size = 256
loop_iterations = 8
program_args = ["1000000"]

[[kernel]]
name = "good"
file = "benchmarks/custom/vecadd_good.cu"

[[kernel]]
name = "poor"
file = "benchmarks/custom/vecadd_poor.cu"
loop_iterations = 16
