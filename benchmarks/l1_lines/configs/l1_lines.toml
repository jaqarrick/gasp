# sectors vs 128-byte lines per warp request, L1-resident reads; name = sectors and lines per request

[defaults]
file = "benchmarks/l1_lines/l1_lines.cu"
problem_size = 1048576
block_size = 256
grid_size = 4096
footprint = 4227072
loop_counts = [64]

[[kernel]]
name = "contiguous"
kernel = "l1_lines"
program_args = ["1048576", "32", "32", "0", "256"]
params = { N = 1048576, group = 32, gap = 32, offset = 0, reads = 256 }
reuse = 0.9961

