# divergent (threadIdx.x & 1) vs uniform (blockIdx.x & 1) branch, N = 1048576, block 64, n = 256 multiply-add steps per side

[defaults]
problem_size = 1048576
block_size = 64
grid_size = 16384
params = { N = 1048576, n = 256 }
program_args = ["1048576", "256"]

[[kernel]]
name = "divergent"
file = "benchmarks/divergence/branch_divergent.cu"
loop_counts = [256, 256]

[[kernel]]
name = "uniform"
file = "benchmarks/divergence/branch_uniform.cu"
loop_counts = [256, 256]
