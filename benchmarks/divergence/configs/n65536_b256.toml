# divergent (threadIdx.x & 1) vs uniform (blockIdx.x & 1) branch, N = 65536, block 256, n = 256 multiply-add steps per side

[defaults]
problem_size = 65536
block_size = 256
grid_size = 256
params = { N = 65536, n = 256 }
program_args = ["65536", "256"]

[[kernel]]
name = "divergent"
file = "benchmarks/divergence/branch_divergent.cu"
loop_counts = [256, 256]

[[kernel]]
name = "uniform"
file = "benchmarks/divergence/branch_uniform.cu"
loop_counts = [256, 256]
