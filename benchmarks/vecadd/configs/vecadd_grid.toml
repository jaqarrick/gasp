# good vs grid-stride vecadd, N = 1000000, block 256; stride runs 272 blocks (4 per SM on the 2080 Ti), longest thread 15 trips

[defaults]
problem_size = 1000000
footprint = 12000000
block_size = 256
program_args = ["1000000"]

[[kernel]]
name = "good"
file = "benchmarks/vecadd/vecadd_good.cu"

[[kernel]]
name = "stride"
file = "benchmarks/vecadd/vecadd_stride.cu"
grid_size = 272
loop_counts = [15]
