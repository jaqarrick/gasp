# good vs poor vecadd, N = 1000000, block 256; loop_iterations has no effect (no loops), it shows a kernel overriding a default

[defaults]
problem_size = 1000000
footprint = 12000000
block_size = 256
loop_iterations = 8
program_args = ["1000000"]

[[kernel]]
name = "good"
file = "benchmarks/vecadd/vecadd_good.cu"

[[kernel]]
name = "poor"
file = "benchmarks/vecadd/vecadd_poor.cu"
loop_iterations = 16
