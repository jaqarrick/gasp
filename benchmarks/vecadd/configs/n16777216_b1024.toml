# gasp --gpu rtx2080ti --run --config benchmarks/vecadd/configs/n16777216_b1024.toml
#
# vecadd pair at N = 16777216, block = 1024, grid = ceil(N / block) = 16384.
# footprint: A, B and C, 16777216 floats each = 12 x N bytes. No loops.

[defaults]
problem_size = 16777216
footprint = 201326592
block_size = 1024
program_args = ["16777216"]

[[kernel]]
name = "good"
file = "benchmarks/vecadd/vecadd_good.cu"

[[kernel]]
name = "poor"
file = "benchmarks/vecadd/vecadd_poor.cu"
