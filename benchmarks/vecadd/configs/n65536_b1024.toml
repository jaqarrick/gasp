# gasp --gpu rtx2080ti --run --config benchmarks/vecadd/configs/n65536_b1024.toml
#
# vecadd pair at N = 65536, block = 1024, grid = ceil(N / block) = 64.
# footprint: A, B and C, 65536 floats each = 12 x N bytes. No loops.

[defaults]
problem_size = 65536
footprint = 786432
block_size = 1024
program_args = ["65536"]

[[kernel]]
name = "good"
file = "benchmarks/vecadd/vecadd_good.cu"

[[kernel]]
name = "poor"
file = "benchmarks/vecadd/vecadd_poor.cu"
