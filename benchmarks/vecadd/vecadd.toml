# gasp --gpu b200 --config benchmarks/vecadd/vecadd.toml
#
# A kernel entry wins over [defaults]. These kernels have no loops, so
# loop_iterations has no effect here; it shows how one kernel overrides a default.

[defaults]
problem_size = 1000000
# distinct global bytes for the cache model: a, b and c, 1000000 floats each
footprint = 12000000
block_size = 256
loop_iterations = 8
program_args = ["1000000"]

[[kernel]]
name = "good"
file = "benchmarks/vecadd/vecadd_good.cu"

[[kernel]]
name = "poor"
file = "benchmarks/vecadd/vecadd_poor.cu"
loop_iterations = 16
