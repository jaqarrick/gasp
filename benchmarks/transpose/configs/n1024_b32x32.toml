# naive (32-way bank conflict) vs padded transpose, n = 1024, block 32x32 (fixed tile)

[defaults]
problem_size = 1024
block_size = [32, 32]
grid_size = [32, 32]
params = { n = 1024 }
program_args = ["1024"]
footprint = 8388608

[[kernel]]
name = "naive"
file = "benchmarks/transpose/transpose_naive.cu"

[[kernel]]
name = "padded"
file = "benchmarks/transpose/transpose_padded.cu"
