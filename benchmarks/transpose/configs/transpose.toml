# naive (32-way bank conflict) vs padded transpose, n = 4096, block 32x32 (fixed tile)

[defaults]
problem_size = 4096
block_size = [32, 32]
grid_size = [128, 128]
params = { n = 4096 }
program_args = ["4096"]
footprint = 134217728

[[kernel]]
name = "naive"
file = "benchmarks/transpose/transpose_naive.cu"

[[kernel]]
name = "padded"
file = "benchmarks/transpose/transpose_padded.cu"
